[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partsiq-common"
version = "0.1.0"
description = "Shared configuration, logging, persistence and health-check utilities for PartsIQ services."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "asyncpg==0.30.0",
    "redis==5.2.1",
]

[tool.setuptools.packages.find]
include = ["partsiq_common*"]
