# CI (prompt 25 — F66). Legacy-suite checks, frontend checks, database integration (RLS,
# budget races, append-only/fencing guarantees) on a DISPOSABLE Supabase Postgres, and
# deterministic evals. Least-privilege permissions; every action is pinned to a commit SHA that
# was verified against its release tag (trailing comment). No production database is ever
# reachable (APP_ENV=test), and pull_request jobs never receive deployment secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: test

jobs:
  python-tests:
    name: legacy suites + foundations (tools/run_checks.py --all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-packages
      # --all runs every foundation test and every service suite, each in its own process.
      - run: uv run python tools/run_checks.py --all
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # The pnpm version is pinned by "packageManager" in the web app's package.json.
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --dir apps/web test

  rls-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The Supabase Postgres image (auth schema + roles); the migrations need both.
        image: supabase/postgres:17.6.1.168
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-packages
      - name: Storage tables for this disposable database (a real project has them)
        run: PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U supabase_admin -d postgres -f tools/ci/storage_stub.sql
      - name: Apply supabase/migrations (refuses edited or destructive migrations)
        run: uv run --all-packages python tools/apply_migrations.py --target ci
        env:
          PARTSIQ_MIGRATE_TARGET: ci
          DATABASE_URL_MIGRATION: postgresql://postgres:postgres@localhost:5432/postgres
      - run: uv run python -m pytest -q tests/integration

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-packages
      - run: uv run python tests/evals/test_scenarios.py
