# CI — single-workflow PartsIQ edition (prompt 25).
#
# Coexistence: the earlier multi-service build left `ci.yml` in place; this file is the
# single-`partsiq`-package pipeline and does NOT replace it. It runs the apps/api pytest
# suite with `uv run --all-packages` (one shared lock, one image), ruff, the frontend
# lint/typecheck/vitest checks, and the deterministic evaluation harness.
#
# Security posture: least-privilege `permissions: contents: read`; every action is pinned
# to a 40-hex commit SHA (recorded here — re-verify each against its release at setup, see
# the trailing tag comment); no production database is reachable (APP_ENV=test); and
# pull_request jobs receive no deployment secrets (deploy lives in deploy-partsiq.yml and is
# workflow_dispatch only).
name: ci-partsiq

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: test

jobs:
  api-tests:
    name: apps/api pytest + ruff
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-packages
      - name: Ruff lint
        run: uv run ruff check apps/api
      - name: Service-isolated apps/api test suite
        run: uv run --all-packages pytest apps/api/tests -q
        env:
          APP_ENV: test

  frontend:
    name: apps/web lint + typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # The pnpm version is pinned by "packageManager" in the web app's package.json.
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --dir apps/web test

  evals:
    name: deterministic evaluations
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-packages
      # Deterministic evaluation harness (prompt 21): partsiq.evaluation.runner replays the
      # committed evals/cases.json offline — no OpenAI import or call, no live provider. The
      # committed suite below asserts reproduced labels and the pinned dataset hash.
      - name: Deterministic fixture evaluation (no live providers)
        run: uv run --all-packages pytest apps/api/tests/test_21_evaluation.py -q
        env:
          APP_ENV: test
          AI_MODE: fixture
