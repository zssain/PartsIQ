# PartsIQ worker service — asynchronous jobs (nameplate OCR, PDF export,
# catalogue import/publish, storage cleanup) consumed from a Redis queue.
#
# Skeleton only at prompt 00: a registered, virtual uv workspace member with NO
# runtime dependencies yet. Its application package (services/worker/app/**) starts
# at prompt 04 (storage) and 15 (leases/dispatcher); real dependencies (psycopg,
# redis, Pillow, openai, Jinja2, playwright, …) are added by those prompts. Adding
# them here would be a forward dependency, which prompt 00 forbids.

[project]
name = "partsiq-worker"
version = "0.1.0"
description = "PartsIQ worker (durable jobs over Redis). Application code added from prompt 04/15."
requires-python = ">=3.12"
# Prompt 17 pins for the PDF export job. Jinja2 and pypdf are installed and used offline;
# the playwright PYTHON package is locked here, but its Chromium browser binary
# (`playwright install chromium`) is a heavy download deferred to the deployment image
# (prompt 24) and is BLOCKED in this environment — the HTML->PDF step is an injected port.
dependencies = [
    "Jinja2==3.1.6",
    "pypdf==6.8.0",
    "playwright==1.58.0",
    # F58 catalogue imports: read XLSX without evaluating formulas (receipt in spec/dependency-receipts.json).
    "openpyxl==3.1.5",
]

[tool.uv]
package = false

# Test discovery for the isolated worker suite (run in its own process by tools/run_checks.py).
# ``app`` is on the path via pythonpath; partsiq_common comes from the shared workspace venv.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
