# PartsIQ orchestrator service — LangGraph durable workflow.
#
# Skeleton only at prompt 00: a registered, virtual uv workspace member with NO
# runtime dependencies yet. Its application package (services/orchestrator/app/**)
# and its real dependencies (langgraph, langgraph-checkpoint-postgres, psycopg,
# openai, …) are introduced by prompt 09 onward. Introducing them here would be a
# forward dependency, which prompt 00's definition of done forbids.

[project]
name = "partsiq-orchestrator"
version = "0.1.0"
description = "PartsIQ orchestrator (durable LangGraph workflow)."
requires-python = ">=3.12"
# Prompt 09 pins (docs/TECH_SPEC.md section 3). The Postgres checkpointer library also
# brings the exact checkpoint schema applied by prompt 03.
dependencies = [
    "partsiq-common",
    "langgraph==1.1.3",
    "langgraph-checkpoint-postgres==3.0.4",
]

[tool.uv]
package = false

[tool.uv.sources]
partsiq-common = { workspace = true }
